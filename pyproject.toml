[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ember"
version = "0.1.0"
authors = [
  { name="Mustafa Sameen" },
]
description = "Wildfire Evacuation Behavior Inference from GPS Data"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "pandas>=2.0.0",
    "geopandas>=0.14.0",
    "shapely>=2.0",
    "pyproj>=3.5.0",
    "numpy>=1.26.0",
    "pyarrow>=14.0",
    "grid-based-home-detection",
    "matplotlib>=3.5.0",
    "seaborn>=0.11.0",
    "contextily>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "black",
    "flake8"
]
